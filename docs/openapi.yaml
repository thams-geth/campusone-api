  /api/v1/transport/routes/{id}/stops:
    post:
      tags: [Transport]
      summary: Add a stop to a route
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, sequence], properties: { name: { type: string }, sequence: { type: integer } } } } } }
      responses: { "201": { description: Created }, "409": { description: "DUPLICATE_SEQUENCE" } }
  /api/v1/transport/stops/{id}:
    delete: { tags: [Transport], summary: Delete a stop, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "STOP_IN_USE" } } }
  /api/v1/transport/allocations:
    get: { tags: [Transport], summary: "List allocations (staff-tier only)", parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } } }
    post:
      tags: [Transport]
      summary: Allocate a route/stop
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studentId, routeId, stopId], properties: { studentId: { type: string }, routeId: { type: string }, stopId: { type: string } } } } } }
      responses: { "201": { description: Created }, "409": { description: "ALREADY_ALLOCATED" } }
  /api/v1/transport/allocations/mine:
    get: { tags: [Transport], summary: "The caller's own allocation (self-service)", responses: { "200": { description: OK } } }
  /api/v1/transport/allocations/{id}/remove:
    post: { tags: [Transport], summary: Remove an allocation, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: "OK, status INACTIVE" } } }

  /api/v1/library/books:
    get: { tags: [Library], summary: List books, parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } } }
    post:
      tags: [Library]
      summary: Create a book
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, author, totalCopies], properties: { title: { type: string }, author: { type: string }, publisher: { type: string }, category: { type: string }, isbn: { type: string }, totalCopies: { type: integer } } } } } }
      responses: { "201": { description: Created } }
  /api/v1/library/books/{id}:
    get: { tags: [Library], summary: Get a book, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    put: { tags: [Library], summary: Update a book, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK } } }
    delete: { tags: [Library], summary: Delete a book, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "BOOK_IN_USE" } } }
  /api/v1/library/issues:
    get:
      tags: [Library]
      summary: "List issues (staff-tier only)"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: bookId, in: query, schema: { type: string } }
        - { name: ownerType, in: query, schema: { type: string, enum: [STUDENT, FACULTY] } }
        - { name: ownerId, in: query, schema: { type: string } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } }
    post:
      tags: [Library]
      summary: Issue a book
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [bookId, ownerType, ownerId, dueDate], properties: { bookId: { type: string }, ownerType: { type: string, enum: [STUDENT, FACULTY] }, ownerId: { type: string }, dueDate: { type: string, format: date } } }
      responses: { "201": { description: Created }, "409": { description: "NO_COPIES_AVAILABLE" } }
  /api/v1/library/issues/mine:
    get: { tags: [Library], summary: "The caller's own issues (self-service)", responses: { "200": { description: OK } } }
  /api/v1/library/issues/{id}/return:
    post: { tags: [Library], summary: "Return a book (computes fineAmount, ₹10/day late)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK } } }

  /api/v1/certificates/types:
    get: { tags: [Certificates], summary: List certificate types, responses: { "200": { description: OK } } }
    post: { tags: [Certificates], summary: Create a certificate type, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, category: { type: string } } } } } }, responses: { "201": { description: Created } } }
  /api/v1/certificates/types/{id}:
    delete: { tags: [Certificates], summary: Delete a certificate type, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "CERTIFICATE_TYPE_IN_USE" } } }
  /api/v1/certificates/requests:
    get: { tags: [Certificates], summary: "List requests (staff-tier only)", parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } } }
    post:
      tags: [Certificates]
      summary: Request a certificate (self-service)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [certificateTypeId], properties: { certificateTypeId: { type: string }, studentId: { type: string } } } } } }
      responses: { "201": { description: "Created, REQUESTED" } }
  /api/v1/certificates/requests/mine:
    get: { tags: [Certificates], summary: "The caller's own requests", responses: { "200": { description: OK } } }
  /api/v1/certificates/requests/{id}/issue:
    post: { tags: [Certificates], summary: "Issue a certificate (sets verificationCode)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "409": { description: "ALREADY_REVIEWED" } } }
  /api/v1/certificates/requests/{id}/reject:
    post:
      tags: [Certificates]
      summary: Reject a certificate request
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rejectionReason], properties: { rejectionReason: { type: string } } } } } }
      responses: { "200": { description: OK } }
  /api/v1/certificates/verify/{code}:
    get:
      tags: [Certificates]
      summary: Verify a certificate by its code
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { valid: { type: boolean }, certificateType: { type: string }, studentName: { type: string }, rollNumber: { type: string }, issuedAt: { type: string, format: date-time } } }

  /api/v1/activities:
    get: { tags: [Activities], summary: "List activities (staff-tier only)", parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: studentId, in: query, schema: { type: string } }, { name: type, in: query, schema: { type: string } }], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } } }
    post:
      tags: [Activities]
      summary: "Record an activity (studentId resolves to caller's own profile if omitted)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, date]
              properties: { type: { type: string, enum: [ACHIEVEMENT, EVENT, CLUB, SPORTS, COMPETITION, INTERNSHIP, OTHER] }, title: { type: string }, description: { type: string }, date: { type: string, format: date }, certificateUrl: { type: string }, studentId: { type: string } }
      responses: { "201": { description: Created } }
  /api/v1/activities/mine:
    get: { tags: [Activities], summary: "The caller's own activities", responses: { "200": { description: OK } } }
  /api/v1/activities/{id}:
    get: { tags: [Activities], summary: Get an activity, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    put: { tags: [Activities], summary: "Update an activity (staff-tier only)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK } } }
    delete: { tags: [Activities], summary: "Delete an activity (staff-tier only)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted } } }

  /api/v1/placements/companies:
    get: { tags: [Placements], summary: List companies, responses: { "200": { description: OK } } }
    post: { tags: [Placements], summary: Create a company, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, website: { type: string } } } } } }, responses: { "201": { description: Created } } }
  /api/v1/placements/companies/{id}:
    delete: { tags: [Placements], summary: Delete a company, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "COMPANY_IN_USE" } } }
  /api/v1/placements/openings:
    get: { tags: [Placements], summary: List job openings, responses: { "200": { description: OK } } }
    post:
      tags: [Placements]
      summary: Create a job opening
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [companyId, title], properties: { companyId: { type: string }, title: { type: string }, description: { type: string }, minCgpa: { type: number }, ctcOffered: { type: number }, applicationDeadline: { type: string, format: date } } }
      responses: { "201": { description: Created } }
  /api/v1/placements/openings/{id}:
    get: { tags: [Placements], summary: Get a job opening, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    delete: { tags: [Placements], summary: Delete a job opening, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "OPENING_IN_USE" } } }
  /api/v1/placements/openings/{id}/apply:
    post:
      tags: [Placements]
      summary: Apply to a job opening (self-service)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { studentId: { type: string } } } } } }
      responses: { "201": { description: "Created, APPLIED" }, "409": { description: "CGPA_NOT_MET / DEADLINE_PASSED / ALREADY_APPLIED" } }
  /api/v1/placements/applications:
    get: { tags: [Placements], summary: "List applications (staff-tier only)", parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: jobOpeningId, in: query, schema: { type: string } }, { name: studentId, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } } }
  /api/v1/placements/applications/mine:
    get: { tags: [Placements], summary: "The caller's own applications", responses: { "200": { description: OK } } }
  /api/v1/placements/applications/{id}/status:
    put:
      tags: [Placements]
      summary: Update an application's status
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [SHORTLISTED, INTERVIEW, SELECTED, REJECTED] }, notes: { type: string }, offeredCtc: { type: number } } }
      responses: { "200": { description: OK }, "409": { description: "APPLICATION_FINALIZED" } }

  /api/v1/billing/plans:
    get:
      tags: [Billing]
      summary: "The global plan catalogue (FREE/PRO/ENTERPRISE, seeded)"
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } }
  /api/v1/billing/subscription:
    get:
      tags: [Billing]
      summary: The caller's own tenant's subscription
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Billing]
      summary: Create or change the caller's own tenant's subscription
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [planId], properties: { planId: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } } }
  /api/v1/billing/subscription/cancel:
    post:
      tags: [Billing]
      summary: "Cancel at period end (sets cancelAtPeriodEnd true)"
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } } }
  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      summary: List billing invoices
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, OVERDUE] } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } }
    post:
      tags: [Billing]
      summary: "Create an invoice (amount defaults to the plan's priceMonthly)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [periodStart, periodEnd], properties: { amount: { type: integer }, periodStart: { type: string, format: date }, periodEnd: { type: string, format: date } } }
      responses: { "201": { description: "Created, PENDING" } }
  /api/v1/billing/invoices/{id}/pay:
    post: { tags: [Billing], summary: Pay an invoice, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "409": { description: ALREADY_PAID } } }
  /api/v1/billing/usage:
    get:
      tags: [Billing]
      summary: "Usage vs. the active plan's limits (computed on read)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string, nullable: true }
                  students: { type: object, properties: { used: { type: integer }, limit: { type: integer, nullable: true } } }
                  faculty: { type: object, properties: { used: { type: integer }, limit: { type: integer, nullable: true } } }

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys (never the raw key or its hash)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
    post:
      tags: [API Keys]
      summary: "Create an API key — the raw key is returned exactly once"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 120 } } } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiKey" }
                  - type: object
                    properties: { key: { type: string, description: "Raw secret — shown once" } }
  /api/v1/api-keys/{id}:
    delete: { tags: [API Keys], summary: "Revoke a key (stops authenticating immediately)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Revoked } } }

  /api/v1/webhooks:
    get: { tags: [Webhooks], summary: List webhook endpoints, responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } } } } } } }
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: "Rejects a non-https, localhost, or private/link-local URL (SSRF guard) — see src/utils/ssrfGuard.ts."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventTypes]
              properties:
                url: { type: string, format: uri, example: "https://example.com/webhooks/campusone" }
                eventTypes: { type: array, items: { type: string, example: student.created } }
                enabled: { type: boolean }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }, "400": { description: "SSRF check failed" } }
  /api/v1/webhooks/{id}:
    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { url: { type: string }, eventTypes: { type: array, items: { type: string } }, enabled: { type: boolean } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } } }
    delete: { tags: [Webhooks], summary: Delete a webhook endpoint, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted } } }
  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List delivery attempts for an endpoint
      parameters: [{ $ref: "#/components/parameters/PathId" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } }

  /api/v1/integrations:
    get: { tags: [Integrations], summary: List configured integrations, responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IntegrationConfig" } } } } } } }
  /api/v1/integrations/{provider}:
    put:
      tags: [Integrations]
      summary: "Enable/disable/configure a provider (config only — no live call)"
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: "#/components/schemas/IntegrationProvider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, settings: { type: object, additionalProperties: true } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationConfig" } } } } }

  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
        - { name: type, in: query, schema: { type: string } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } }
    post:
      tags: [Approvals]
      summary: "Create an approval request (type is a free-form string a future module names)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, entity, entityId]
              properties: { type: { type: string }, entity: { type: string }, entityId: { type: string }, reason: { type: string } }
      responses: { "201": { description: "Created, PENDING" } }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a request
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { decisionNotes: { type: string } } } } } }
      responses: { "200": { description: OK }, "409": { description: ALREADY_DECIDED } }
  /api/v1/approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a request
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { decisionNotes: { type: string } } } } } }
      responses: { "200": { description: OK }, "409": { description: ALREADY_DECIDED } }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: "List the caller's own notifications"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } } }
  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread count
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } } } }
  /api/v1/notifications/{id}/read:
    post: { tags: [Notifications], summary: Mark one notification read, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: OK } } }
  /api/v1/notifications/read-all:
    post: { tags: [Notifications], summary: Mark every unread notification read, responses: { "204": { description: OK } } }
  /api/v1/notifications/preferences:
    get:
      tags: [Notifications]
      summary: "Channel preferences (IN_APP not listed — can't be disabled)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { channel: { type: string, enum: [EMAIL, SMS, PUSH] }, enabled: { type: boolean } } } }
  /api/v1/notifications/preferences/{channel}:
    put:
      tags: [Notifications]
      summary: Set a channel preference
      parameters: [{ name: channel, in: path, required: true, schema: { type: string, enum: [IN_APP, EMAIL, SMS, PUSH] } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { channel: { type: string }, enabled: { type: boolean } } } } } }
        "400": { description: "channel IN_APP cannot be disabled" }

  /api/v1/class-groups/{sectionId}/messages:
    get:
      tags: [Class Groups]
      summary: List messages in a section's class group
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
        "403": { description: "Not a member of this section, and doesn't hold CLASS_GROUP_MANAGE" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Class Groups]
      summary: Post a message (fans out an in-app notification to every other member)
      parameters: [{ name: sectionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 2000 } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, sectionId: { type: string }, body: { type: string }, createdAt: { type: string, format: date-time }, author: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        "403": { description: "Not a member of this section, and doesn't hold CLASS_GROUP_MANAGE" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from POST /auth/login or /auth/refresh."
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Alternate credential — a key authenticates AS its creating user (see API Keys)."

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: search
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: "Bad request — code BAD_REQUEST or a domain-specific code"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: "Missing/invalid/expired credential — code UNAUTHORIZED"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: "Caller lacks the required permission, or the tenant lacks the module — code FORBIDDEN"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: "code NOT_FOUND"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: "A domain-specific conflict code (e.g. DUPLICATE_CODE, ALREADY_PAID)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ValidationError:
      description: "code VALIDATION_ERROR — Zod rejected the request body"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    TooManyRequests:
      description: "code TOO_MANY_REQUESTS — rate limit hit"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PaginatedDepartments:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/PaginatedMeta" }
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Department" } } }

  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string, example: "Human-readable message" }
        code: { type: string, example: BAD_REQUEST }
        details: { type: object, additionalProperties: true, nullable: true }

    PaginatedMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    PaginatedGeneric:
      description: "Every list endpoint returns this shape — `data`'s item shape is the entity named in the route's summary."
      allOf:
        - { $ref: "#/components/schemas/PaginatedMeta" }
        - type: object
          properties: { data: { type: array, items: { type: object } } }

    AuthUser:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, example: SUPER_ADMIN }
        isActive: { type: boolean }
        mfaEnabled: { type: boolean }

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EXCUSED, ON_LEAVE]

    FeeCategory:
      type: string
      enum: [TUITION, HOSTEL, TRANSPORT, EXAM, LIBRARY, LAB, OTHER]

    IntegrationProvider:
      type: string
      enum: [PAYMENT_GATEWAY, EMAIL, SMS, FIREBASE, GOOGLE_WORKSPACE, MICROSOFT_365, BIOMETRIC_ATTENDANCE, ACCOUNTING_SOFTWARE, LMS, LIBRARY_SYSTEM]

    DepartmentInput:
      type: object
      required: [name, code, status]
      properties:
        name: { type: string }
        code: { type: string, minLength: 2, maxLength: 12, description: "Uppercased" }
        headOfDepartment: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    Department:
      allOf:
        - { $ref: "#/components/schemas/DepartmentInput" }
        - type: object
          properties:
            id: { type: string }
            tenantId: { type: string }
            facultyCount: { type: integer }
            studentCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    StudentInput:
      type: object
      required: [firstName, lastName, email, phone, rollNumber, departmentId, gender, dateOfBirth, admissionDate, status]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        rollNumber: { type: string }
        departmentId: { type: string }
        sectionId: { type: string, nullable: true }
        currentSemester: { type: integer, minimum: 1, maximum: 12, nullable: true }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        dateOfBirth: { type: string, format: date }
        admissionDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, INACTIVE, ALUMNI] }
        guardianName: { type: string }
        guardianPhone: { type: string }
        address: { type: string }

    Student:
      allOf:
        - { $ref: "#/components/schemas/StudentInput" }
        - type: object
          properties: { id: { type: string }, tenantId: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }

    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: PRO }
        studentLimit: { type: integer }
        facultyLimit: { type: integer }
        priceMonthly: { type: number }
        description: { type: string, nullable: true }

    Subscription:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        planId: { type: string }
        plan: { $ref: "#/components/schemas/Plan" }
        status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        keyPrefix: { type: string, example: "cok_ee44e5fb" }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        url: { type: string, format: uri }
        eventTypes: { type: array, items: { type: string } }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IntegrationConfig:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        provider: { $ref: "#/components/schemas/IntegrationProvider" }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
