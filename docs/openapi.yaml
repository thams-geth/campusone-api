  /api/v1/examinations/schedules/{id}/marks/verify:
    post: { tags: [Examinations], summary: "Bulk verify (SUBMITTED -> VERIFIED)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "409": { description: "NO_MARKS_TO_TRANSITION" } } }
  /api/v1/examinations/schedules/{id}/marks/publish:
    post: { tags: [Examinations], summary: "Bulk publish (VERIFIED -> PUBLISHED)", parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "409": { description: "NO_MARKS_TO_TRANSITION" } } }
