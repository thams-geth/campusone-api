openapi: 3.0.3
info:
  title: CampusOne API
  version: "1.0"
  description: |
    Backend API for **CampusOne**, a multi-tenant SaaS college management platform.
    Any college signs up as a **tenant**; every table carries a `tenantId` and is
    isolated with Postgres Row-Level Security. Features are enabled per tenant like
    installable **modules** (`CORE` is always on).

    ## Conventions
    - All routes except `/health*`, `POST /api/v1/auth/login`, and
      `POST /api/v1/auth/refresh` require `Authorization: Bearer <accessToken>`
      (or an `X-API-Key` header — see Auth / API Keys).
    - Every route also requires the tenant to have the owning module enabled
      (`403` if not) and the caller's role to hold the specific permission the
      route declares (see each tag's description).
    - List endpoints return the paginated envelope `{ data, meta }` — see
      `PaginatedMeta` below.
    - Any non-2xx response is `{ message, code, details? }` — see `ErrorResponse`.
      A `422` with `code: VALIDATION_ERROR` means Zod rejected the request body;
      `details` is a `{ field: [messages] }` map.
  contact:
    name: CampusOne API source
    url: https://github.com/

servers:
  - url: http://localhost:4000
    description: Local dev server

tags:
  - name: Health
    description: Unversioned liveness/readiness checks.
  - name: Auth
    description: Login, refresh, logout, MFA (TOTP), sessions, login history. No module gate.
  - name: Departments
    description: "Module: CORE. Permissions DEPARTMENT_READ/_CREATE/_UPDATE/_DELETE."
  - name: Students
    description: "Module: CORE. Permissions STUDENT_READ/_CREATE/_UPDATE/_DELETE."
  - name: Dashboard
    description: "Module: CORE. Permission DASHBOARD_READ. Read-only."
  - name: Academic Years
    description: "Module: CORE. Permissions ACADEMIC_YEAR_READ/_CREATE/_UPDATE/_DELETE."
  - name: Programs
    description: "Module: CORE. Permissions PROGRAM_READ/_CREATE/_UPDATE/_DELETE."
  - name: Batches
    description: "Module: CORE. Permissions BATCH_READ/_CREATE/_UPDATE/_DELETE."
  - name: Sections
    description: "Module: CORE. Permissions SECTION_READ/_CREATE/_UPDATE/_DELETE."
  - name: Subjects
    description: "Module: CORE. Permissions SUBJECT_READ/_CREATE/_UPDATE/_DELETE."
  - name: Faculty
    description: "Module: CORE. Permissions FACULTY_READ/_CREATE/_UPDATE/_DELETE."
  - name: Rooms
    description: "Module: CORE. Permissions ROOM_READ/_CREATE/_UPDATE/_DELETE."
  - name: Timetable
    description: "Module: ACADEMICS. Permissions TIMETABLE_READ/_CREATE/_UPDATE/_DELETE."
  - name: Institution
    description: "Module: CORE. Permissions INSTITUTION_READ/_UPDATE. Singleton (caller's own tenant)."
  - name: RBAC
    description: "Module: CORE. Permissions ROLE_READ/ROLE_MANAGE."
  - name: Audit Logs
    description: "Module: CORE. Permission AUDIT_LOG_READ."
  - name: Attendance
    description: "Module: ACADEMICS. Permissions ATTENDANCE_READ/_MARK/_EDIT/_APPROVE."
  - name: Leave
    description: "Module: ACADEMICS. Permissions LEAVE_READ/_REQUEST/_APPROVE."
  - name: Assignments
    description: "Module: ACADEMICS. Permissions ASSIGNMENT_READ/_MANAGE/_SUBMIT/_EVALUATE."
  - name: Examinations
    description: "Module: EXAMINATION. Permissions EXAM_READ/_MANAGE, MARKS_READ/_ENTER/_EDIT/_VERIFY/_PUBLISH/_REVISE."
  - name: Announcements
    description: "Module: COMMUNICATION. Permissions ANNOUNCEMENT_READ/_MANAGE."
  - name: Documents
    description: "Module: CORE. Permissions DOCUMENT_READ/_MANAGE/_VERIFY."
  - name: Reports
    description: "Module: CORE. Permission REPORTS_READ. Read-only aggregations."
  - name: Import-Export
    description: "Module: CORE. Permissions STUDENT_IMPORT/STUDENT_EXPORT. CSV only."
  - name: Admissions
    description: "Module: ADMISSIONS. Permissions ADMISSION_READ/_CREATE/_UPDATE/_DECIDE/_ENROLL."
  - name: Fees
    description: "Module: FINANCE. Permissions FEE_READ/_MANAGE, PAYMENT_RECORD/_REFUND. Internal ledger, no live gateway."
  - name: Hostel
    description: "Module: HOSTEL_TRANSPORT. Permissions HOSTEL_READ/_MANAGE/_ALLOCATE."
  - name: Transport
    description: "Module: HOSTEL_TRANSPORT. Permissions TRANSPORT_READ/_MANAGE/_ALLOCATE."
  - name: Library
    description: "Module: LIBRARY. Permissions LIBRARY_READ/_MANAGE/_ISSUE."
  - name: Certificates
    description: "Module: CORE. Permissions CERTIFICATE_READ/_REQUEST/_ISSUE."
  - name: Activities
    description: "Module: CORE. Permissions ACTIVITY_READ/_MANAGE/_SELF_REPORT."
  - name: Placements
    description: "Module: PLACEMENT_ALUMNI. Permissions PLACEMENT_READ/_MANAGE/_APPLY."
  - name: Billing
    description: "Module: CORE. Permissions BILLING_READ/_MANAGE. Internal subscription/invoice ledger."
  - name: API Keys
    description: "Module: CORE. Permissions API_KEY_READ/_MANAGE. A key authenticates AS its creating user."
  - name: Webhooks
    description: "Module: CORE. Permissions WEBHOOK_READ/_MANAGE. SSRF-guarded, inline HMAC-signed delivery."
  - name: Integrations
    description: "Module: CORE. Permissions INTEGRATION_READ/_MANAGE. Config only, no live calls."
  - name: Approvals
    description: "Module: CORE. Permissions APPROVAL_READ/_MANAGE. Minimal generic approval engine."
  - name: Notifications
    description: "Module: CORE. Permission NOTIFICATION_READ. Self-account-management only."
  - name: Class Groups
    description: "Module: CORE. Permissions CLASS_GROUP_READ/_POST/_MANAGE. A Section's message board."

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness (basic)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks the database connection)
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "503": { description: Database unreachable }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Rate-limited (20 req/15min). If MFA is enabled on the account, a missing/wrong `mfaCode` fails 401 before any token is issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mfaCode: { type: string, description: "Required once MFA is enabled on the account" }
      responses:
        "200":
          description: Logged in. Also sets an httpOnly `refreshToken` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AuthUser" }
                  token: { type: string, description: JWT access token }
        "401":
          description: Invalid credentials, inactive/locked account, or MFA required/invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                mfaRequired: { value: { message: "MFA code required.", code: MFA_REQUIRED } }
                mfaInvalid: { value: { message: "Invalid MFA code.", code: MFA_INVALID } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token, issue a new access token
      description: Requires the httpOnly `refreshToken` cookie. Rate-limited (20 req/15min).
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes and clears the refresh token cookie.
      security: []
      responses:
        "204": { description: Logged out }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AuthUser" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Begin MFA setup (TOTP)
      description: Generates a new secret + 10 one-time recovery codes. Replaces any previous pending setup. Does not enable MFA yet — call `/mfa/enable` with a verified code.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Base32 TOTP secret" }
                  otpauthUri: { type: string, description: "otpauth:// URI — render as a QR code" }
                  recoveryCodes: { type: array, items: { type: string }, description: "Shown once" }
  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Enable MFA
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: List the caller's own active sessions
      description: A session is a non-revoked, non-expired RefreshToken row.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: { id: { type: string }, createdAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a session ("log out this device")
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/login-history:
    get:
      tags: [Auth]
      summary: The caller's own last 50 login attempts (success and failure)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    success: { type: boolean }
                    ipAddress: { type: string, nullable: true }
                    userAgent: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }

  /api/v1/departments:
    get:
      tags: [Departments]
      summary: List departments
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Search" }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "200": { $ref: "#/components/responses/PaginatedDepartments" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Departments]
      summary: Create a department
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DepartmentInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Department" } } } }
        "409": { description: "DUPLICATE_CODE — repeated code (case-insensitive, per tenant)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/departments/{id}:
    get:
      tags: [Departments]
      summary: Get a department
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Department" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Departments]
      summary: Update a department
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DepartmentInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Department" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Departments]
      summary: Delete a department
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Deleted }
        "409": { description: "DEPARTMENT_IN_USE — still has students", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/students:
    get:
      tags: [Students]
      summary: List students
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Search" }
        - name: departmentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALUMNI] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginatedMeta" }
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/Student" } } }
    post:
      tags: [Students]
      summary: Create a student
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StudentInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
        "409": { description: "DUPLICATE_EMAIL / DUPLICATE_ROLL_NUMBER", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/students/{id}:
    get:
      tags: [Students]
      summary: Get a student
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Students]
      summary: Update a student
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StudentInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
    delete:
      tags: [Students]
      summary: Delete a student
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Deleted }

  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Summary counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalStudents: { type: integer }
                  activeStudents: { type: integer }
                  totalDepartments: { type: integer }
                  totalFaculty: { type: integer }
                  pendingAdmissions: { type: integer, description: "Hardcoded placeholder (7)" }
  /api/v1/dashboard/trend:
    get:
      tags: [Dashboard]
      summary: Enrollment trend by admission month
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { month: { type: string }, count: { type: integer } } } } } } }
  /api/v1/dashboard/distribution:
    get:
      tags: [Dashboard]
      summary: Student distribution by active department
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { departmentId: { type: string }, name: { type: string }, code: { type: string }, studentCount: { type: integer } } } } } } }
  /api/v1/dashboard/activity:
    get:
      tags: [Dashboard]
      summary: Latest 10 audit activity entries
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, message: { type: string }, actor: { type: string }, timestamp: { type: string, format: date-time } } } } } } }

  /api/v1/academic-years:
    get:
      tags: [Academic Years]
      summary: List academic years
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Academic Years]
      summary: Create an academic year
      description: Setting `isCurrent true` clears it on every other academic year for the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name: { type: string, maxLength: 20 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                isCurrent: { type: boolean }
                status: { type: string, enum: [ACTIVE, CLOSED] }
      responses:
        "201": { description: Created }
        "409": { description: "DUPLICATE_ACADEMIC_YEAR" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/academic-years/{id}:
    get:
      tags: [Academic Years]
      summary: Get an academic year
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Academic Years]
      summary: Update an academic year
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses: { "200": { description: OK } }
    delete:
      tags: [Academic Years]
      summary: Delete an academic year
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses: { "204": { description: Deleted }, "409": { description: "ACADEMIC_YEAR_IN_USE — still has batches" } }

  /api/v1/programs:
    get:
      tags: [Programs]
      summary: List programs
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Search" }
        - name: departmentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Programs]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, name, code, durationYears]
              properties:
                departmentId: { type: string }
                name: { type: string }
                code: { type: string, minLength: 2, maxLength: 12 }
                durationYears: { type: integer, minimum: 1, maximum: 10 }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "201": { description: Created }
        "400": { description: "Invalid departmentId" }
        "409": { description: "DUPLICATE_CODE" }
  /api/v1/programs/{id}:
    get: { tags: [Programs], summary: Get a program, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    put:
      tags: [Programs]
      summary: Update a program
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses: { "200": { description: OK } }
    delete:
      tags: [Programs]
      summary: Delete a program
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses: { "204": { description: Deleted }, "409": { description: "PROGRAM_IN_USE — still has batches or subjects" } }

  /api/v1/batches:
    get:
      tags: [Batches]
      summary: List batches
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Batches]
      summary: Create a batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programId, academicYearId, name, startYear, endYear]
              properties:
                programId: { type: string }
                academicYearId: { type: string }
                name: { type: string, maxLength: 40 }
                startYear: { type: integer }
                endYear: { type: integer, description: "> startYear" }
                status: { type: string, enum: [ACTIVE, INACTIVE, GRADUATED] }
      responses:
        "201": { description: Created }
        "409": { description: "DUPLICATE_BATCH — repeated name within the program" }
  /api/v1/batches/{id}:
    get: { tags: [Batches], summary: Get a batch, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    put: { tags: [Batches], summary: Update a batch, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK } } }
    delete: { tags: [Batches], summary: Delete a batch, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "BATCH_IN_USE — still has sections" } } }

  /api/v1/sections:
    get:
      tags: [Sections]
      summary: List sections
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Sections]
      summary: Create a section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, name, currentSemester]
              properties:
                batchId: { type: string }
                name: { type: string, maxLength: 10 }
                currentSemester: { type: integer, minimum: 1, maximum: 12 }
                capacity: { type: integer }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "201": { description: Created }
        "409": { description: "DUPLICATE_SECTION — repeated name within the batch" }
  /api/v1/sections/{id}:
    get: { tags: [Sections], summary: Get a section, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    put: { tags: [Sections], summary: Update a section, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "200": { description: OK } } }
    delete: { tags: [Sections], summary: Delete a section, parameters: [{ $ref: "#/components/parameters/PathId" }], responses: { "204": { description: Deleted }, "409": { description: "SECTION_IN_USE — still has students or timetable entries" } } }

  /api/v1/subjects:
    get:
      tags: [Subjects]
      summary: List subjects
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Subjects]
      summary: Create a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
