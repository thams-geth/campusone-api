                  type: array
                  items:
                    type: object
                    properties: { studentId: { type: string }, marksObtained: { type: number, nullable: true }, maxMarks: { type: number }, specialStatus: { type: string, enum: [ABSENT, MALPRACTICE, WITHHELD], nullable: true } }
