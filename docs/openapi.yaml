  /api/v1/timetable:
    get:
      tags: [Timetable]
      summary: List timetable entries
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: sectionId
          in: query
          schema: { type: string }
        - name: facultyId
          in: query
          schema: { type: string }
        - name: roomId
          in: query
          schema: { type: string }
        - name: dayOfWeek
          in: query
          schema: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedGeneric" } } } }
    post:
      tags: [Timetable]
      summary: Create a timetable entry
      description: "409 FACULTY_CONFLICT / ROOM_CONFLICT / SECTION_CONFLICT if an overlapping entry already exists that day."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionId, subjectId, facultyId, roomId, dayOfWeek, startTime, endTime]
              properties:
                sectionId: { type: string }
                subjectId: { type: string }
                facultyId: { type: string }
                roomId: { type: string }
                dayOfWeek: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
                startTime: { type: string, example: "09:00", description: "HH:mm 24h" }
                endTime: { type: string, example: "10:00" }
      responses:
        "201": { description: Created }
        "400": { description: "Invalid relation id" }
        "409": { description: "FACULTY_CONFLICT / ROOM_CONFLICT / SECTION_CONFLICT" }
  /api/v1/timetable/{id}:
