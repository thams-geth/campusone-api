services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusone
      POSTGRES_PASSWORD: campusone_dev_password
      POSTGRES_DB: campusone
    ports:
      - '5432:5432'
    volumes:
      - campusone_postgres_data:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/init-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusone']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - campusone_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusone_postgres_data:
  campusone_redis_data:
